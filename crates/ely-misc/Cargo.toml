[package]
name = "ely-misc"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ely's assorted components for GPUI: clocks, calculators, codes, web views and more."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
test-support = ["ely-core/test-support", "gpui/test-support", "gpui/leak-detection"]

[dependencies]
ely-core.workspace = true
ely-canvas.workspace = true
ely-media.workspace = true
gpui.workspace = true
image.workspace = true
jiff.workspace = true
log.workspace = true
qrcode.workspace = true
rqrr = { version = "0.11", default-features = false }
smallvec.workspace = true
web-time.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.57", default-features = false }

[lints]
workspace = true
