[package]
name = "ely-desktop"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ely's desktop integrations for GPUI: the tray icon, the Dock badge and Omarchy's theme."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
test-support = ["ely-core/test-support", "gpui/test-support", "gpui/leak-detection"]

[dependencies]
ely-core.workspace = true
ely-devtools.workspace = true
anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
log.workspace = true
web-time.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
notify = "8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSDockTile",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
image = { workspace = true, features = ["png"] }
serde.workspace = true
zbus = { version = "5", default-features = false, features = ["async-io"] }

[lints]
workspace = true
