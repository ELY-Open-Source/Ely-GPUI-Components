[package]
name = "ely-core"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ely's core for GPUI: theme, motion, primitives, typography, layout, shell, controls, overlays, lists and tables."
repository.workspace = true
publish = false

[features]
default = ["runtime_shaders"]
runtime_shaders = ["gpui_platform/runtime_shaders"]
test-support = ["gpui/test-support", "gpui/leak-detection"]

[dependencies]
anyhow.workspace = true
barcoders = { version = "2", default-features = false, features = ["std"] }
emojis.workspace = true
futures.workspace = true
gpui = { workspace = true, features = ["stacker"] }
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
image.workspace = true
iso_currency.workspace = true
isocountry.workspace = true
isolang = { version = "2.4", features = ["local_names", "list_languages"] }
jiff.workspace = true
log.workspace = true
qrcode.workspace = true
regex.workspace = true
rust-embed = "8.12"
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
unicode-segmentation.workspace = true
web-time.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
jiff = { workspace = true, features = ["js"] }
rust-embed = { version = "8.12", features = ["debug-embed"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSColorSampler",
    "NSColorSpace",
    "NSControl",
    "NSDockTile",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSSharingService",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSArray",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
] }
raw-window-handle.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
image = { workspace = true, features = ["png"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

[lints]
workspace = true
