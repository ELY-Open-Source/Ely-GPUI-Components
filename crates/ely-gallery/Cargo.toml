[package]
name = "ely-gallery"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Every Ely component on its chapter's page, native and in the browser."
repository.workspace = true
publish = false

[[bin]]
name = "gallery"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ely-gpui-component = { path = "../.." }
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image = { workspace = true, features = ["png"] }
jiff.workspace = true
log.workspace = true
qrcode.workspace = true
serde.workspace = true
serde_json.workspace = true
web-time.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Location", "UrlSearchParams", "Window"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
core-foundation = "0.10"
core-graphics = "0.24"
objc = "0.2"
raw-window-handle.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle.workspace = true
# The capture harness reads a window back over X11, as gpui's own backend talks to the server.
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle.workspace = true
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[[example]]
name = "docs_hello"
path = "examples/docs/hello.rs"

[[example]]
name = "docs_start"
path = "examples/docs/start.rs"

[[example]]
name = "docs_theme"
path = "examples/docs/theme.rs"

[[example]]
name = "docs_focus"
path = "examples/docs/focus.rs"

[[example]]
name = "docs_motion"
path = "examples/docs/motion.rs"

[[example]]
name = "docs_icons"
path = "examples/docs/icons.rs"

[[example]]
name = "docs_overlays"
path = "examples/docs/overlays.rs"

[[example]]
name = "docs_i18n"
path = "examples/docs/i18n.rs"

[[example]]
name = "docs_render"
path = "examples/docs/render.rs"
