name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  crate:
    # The Mac mini: its system fonts set the CJK and math tests, and it times the linear-format test steadily.
    runs-on: [self-hosted, macos-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh

  platforms:
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted runners; macOS arm64 is the crate job above.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      # gpui's Wayland and X11 backends link xkbcommon and fontconfig.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libfontconfig-dev
      # Hosted runners test as a plain user, so the file permissions the tests check hold.
      - run: cargo test -p ely-core -p ely-gpui-component --lib --features ely-core/test-support,ely-gpui-component/test-support --quiet
      - run: cargo build -p ely-gallery

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
