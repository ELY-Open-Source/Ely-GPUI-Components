name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  crate:
    # The Mac mini runs the whole gate: the house rules, the Kit compat crate and the wasm32 lint.
    runs-on: [self-hosted, macos-arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # panics.py counts against the PR's base or the commit before the push.
      - run: scripts/check.sh
        env:
          PANICS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  platforms:
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted runners; macOS arm64 is the crate job above.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # gpui's Wayland and X11 backends link xkbcommon and fontconfig.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libfontconfig-dev
      # Hosted runners test as a plain user, so the file permissions the tests check hold.
      - run: cargo test --workspace --exclude ely-gallery --lib --all-features --quiet
      - run: cargo test --workspace --exclude ely-gallery --doc --all-features --quiet
      - run: cargo test -p ely-gpui-component --all-features --test '*' --quiet
      # docs.rs builds on Linux with default features and `docsrs` set.
      - if: runner.os == 'Linux'
        run: cargo doc --workspace --exclude ely-gallery --no-deps --quiet
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
      # Each host compiles its own platform code, so each counts its own sites.
      - run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/panics.py
        shell: bash
        env:
          PANICS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: cargo build -p ely-gallery
      # Tabs every page under a UI Automation client; each stop needs a role and a name.
      - if: runner.os == 'Windows'
        shell: bash
        run: ./target/debug/gallery.exe --audit audit.tsv || { grep -v $'\tok\t' audit.tsv; exit 1; }

  api:
    # Each library's public API matches its snapshot in api/, taken on Linux.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: pins
        run: |
          echo "nightly=$(python3 scripts/api.py --toolchain)" >> "$GITHUB_OUTPUT"
          echo "tool=$(python3 scripts/api.py --tool)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pins.outputs.nightly }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libfontconfig-dev
      - run: cargo install --locked cargo-public-api --version ${{ steps.pins.outputs.tool }}
      - run: python3 scripts/api.py

  semver:
    # A breaking change needs its crate's version raised; the base commit stands in for crates.io.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libfontconfig-dev
      - run: cargo install --locked cargo-semver-checks --version "$(python3 scripts/semver.py --tool)"
      - run: python3 scripts/semver.py "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The base benches on this same runner; numbers from two machines do not compare.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: base
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libfontconfig-dev
      - shell: bash
        run: |
          rm -rf target/criterion
          bench="cargo bench -p ely-gpui-component --features test-support --bench budget --"
          if [ -f base/benches/budget.rs ]; then
            (cd base && CARGO_TARGET_DIR=../target $bench --save-baseline base)
            $bench --baseline base
            python3 scripts/bench.py --against base
          else
            echo "bench: the base has no benches; budgets only"
            $bench
            python3 scripts/bench.py
          fi

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
