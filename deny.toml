# cargo-deny: licenses, advisories, sources. CI's `deny` job runs `cargo deny --workspace --all-features check`.

[graph]
all-features = true

[advisories]
# Vulnerabilities and unsound code fail at any depth; an unmaintained crate only when Ely names it, since gpui's pin brings the rest.
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses, and MPL-2.0, which binds only its own files: servo's cssparser and selectors, dwrote, option-ext.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# Second versions are tracked by hand (AGENTS.md, tasks/optimization.md A4).
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
