[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/ELY-Open-Source/Ely-GPUI-Components"

[workspace.dependencies]
anyhow = "1"
emojis = "0.9"
futures = "0.3"
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9" }
gpui_web = { package = "gpui-pre-web", version = "=0.3.9" }
image = { version = "0.25", default-features = false }
iso_currency = "0.7"
isocountry = "0.3"
jiff = "0.2"
log = "0.4"
qrcode = { version = "0.14", default-features = false }
raw-window-handle = "0.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = "1"
unicode-segmentation = "1"
web-time = "1.1"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[package]
name = "ely-gpui-component"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A restrained component library for GPUI, in light and dark."
repository.workspace = true
publish = false

[features]
default = ["runtime_shaders"]
runtime_shaders = ["ely-core/runtime_shaders"]
test-support = ["ely-core/test-support", "gpui/test-support", "gpui/leak-detection"]

[dependencies]
anyhow.workspace = true
base64 = "0.22"
ely-core = { path = "crates/ely-core", default-features = false }
emojis.workspace = true
entities = "1"
futures.workspace = true
gpui = { workspace = true, features = ["stacker"] }
image.workspace = true
iso_currency.workspace = true
isocountry.workspace = true
jiff.workspace = true
log.workspace = true
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
qrcode.workspace = true
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
ratex-types = "0.1.14"
regex.workspace = true
rqrr = { version = "0.11", default-features = false }
serde_json.workspace = true
similar = { version = "3.2", default-features = false, features = ["std", "text", "inline", "unicode"] }
smallvec.workspace = true
unicode-segmentation.workspace = true
unicode-width = "0.2"
usvg = "0.46"
vte = { version = "0.15", default-features = false, features = ["std", "ansi"] }
web-time.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
notify = "8"

[target.'cfg(target_family = "wasm")'.dependencies]
similar = { version = "3.2", default-features = false, features = ["wasm32_web_time"] }

[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.57", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["time"] }

[lints]
workspace = true

# The web gallery: small over fast, one unit so LTO sees everything.
[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
