[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/ELY-Open-Source/Ely-GPUI-Components"

[workspace.dependencies]
ely-desktop = { path = "crates/ely-desktop", version = "0.1.1" }
ely-rendering = { path = "crates/ely-rendering", version = "0.1.1" }
ely-tooling = { path = "crates/ely-tooling", version = "0.1.1" }
ely-misc = { path = "crates/ely-misc", version = "0.1.1" }
ely-maps = { path = "crates/ely-maps", version = "0.1.1" }
ely-interaction = { path = "crates/ely-interaction", version = "0.1.1" }
ely-onboarding = { path = "crates/ely-onboarding", version = "0.1.1" }
ely-account = { path = "crates/ely-account", version = "0.1.1" }
ely-settings = { path = "crates/ely-settings", version = "0.1.1" }
ely-dashboard = { path = "crates/ely-dashboard", version = "0.1.1" }
ely-devtools = { path = "crates/ely-devtools", version = "0.1.1" }
ely-canvas = { path = "crates/ely-canvas", version = "0.1.1" }
ely-project = { path = "crates/ely-project", version = "0.1.1" }
ely-calendar = { path = "crates/ely-calendar", version = "0.1.1" }
ely-mail = { path = "crates/ely-mail", version = "0.1.1" }
ely-messaging = { path = "crates/ely-messaging", version = "0.1.1" }
ely-files = { path = "crates/ely-files", version = "0.1.1" }
ely-media = { path = "crates/ely-media", version = "0.1.1" }
ely-generative = { path = "crates/ely-generative", version = "0.1.1" }
ely-agent = { path = "crates/ely-agent", version = "0.1.1" }
ely-chat = { path = "crates/ely-chat", version = "0.1.1" }
ely-collab = { path = "crates/ely-collab", version = "0.1.1" }
ely-documents = { path = "crates/ely-documents", version = "0.1.1" }
ely-debug = { path = "crates/ely-debug", version = "0.1.1" }
ely-git = { path = "crates/ely-git", version = "0.1.1" }
ely-terminal = { path = "crates/ely-terminal", version = "0.1.1" }
ely-editor = { path = "crates/ely-editor", version = "0.1.1" }
ely-finance = { path = "crates/ely-finance", version = "0.1.1" }
ely-charts = { path = "crates/ely-charts", version = "0.1.1" }
ely-core = { path = "crates/ely-core", version = "0.1.1", default-features = false }
anyhow = "1"
emojis = "0.9"
futures = "0.3"
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9" }
gpui_web = { package = "gpui-pre-web", version = "=0.3.9" }
image = { version = "0.25", default-features = false }
iso_currency = "0.7"
isocountry = "0.3"
jiff = "0.2"
log = "0.4"
qrcode = { version = "0.14", default-features = false }
raw-window-handle = "0.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = "1"
unicode-segmentation = "1"
web-time = "1.1"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[package]
name = "ely-gpui-component"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A restrained component library for GPUI, in light and dark."
repository.workspace = true
publish = false

[features]
default = ["runtime_shaders"]
runtime_shaders = ["ely-core/runtime_shaders"]
test-support = ["ely-core/test-support", "gpui/test-support", "gpui/leak-detection"]

[dependencies]
ely-account.workspace = true
ely-agent.workspace = true
ely-calendar.workspace = true
ely-canvas.workspace = true
ely-charts.workspace = true
ely-chat.workspace = true
ely-collab.workspace = true
ely-core = { workspace = true, features = ["languages"] }
ely-dashboard.workspace = true
ely-debug.workspace = true
ely-desktop.workspace = true
ely-devtools.workspace = true
ely-documents.workspace = true
ely-editor.workspace = true
ely-files.workspace = true
ely-finance.workspace = true
ely-generative.workspace = true
ely-git.workspace = true
ely-interaction.workspace = true
ely-mail.workspace = true
ely-maps.workspace = true
ely-media.workspace = true
ely-messaging.workspace = true
ely-misc.workspace = true
ely-onboarding.workspace = true
ely-project.workspace = true
ely-rendering.workspace = true
ely-settings.workspace = true
ely-terminal.workspace = true
ely-tooling.workspace = true
anyhow.workspace = true
gpui.workspace = true

[lints]
workspace = true

# The web gallery: small over fast, one unit so LTO sees everything.
[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
