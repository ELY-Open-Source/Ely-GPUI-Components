[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/ELY-Open-Source/Ely-GPUI-Components"

[workspace.dependencies]
anyhow = "1"
futures = "0.3"
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9" }
gpui_web = { package = "gpui-pre-web", version = "=0.3.9" }
image = { version = "0.25", default-features = false }
jiff = "0.2"
log = "0.4"
qrcode = { version = "0.14", default-features = false }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
web-time = "1.1"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[package]
name = "ely-gpui-component"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A restrained component library for GPUI, in light and dark."
repository.workspace = true
publish = false

[features]
default = ["runtime_shaders"]
runtime_shaders = ["gpui_platform/runtime_shaders"]
test-support = ["gpui/test-support", "gpui/leak-detection"]

[dependencies]
anyhow.workspace = true
base64 = "0.22"
barcoders = { version = "2", default-features = false, features = ["std"] }
emojis = "0.9"
futures.workspace = true
gpui = { workspace = true, features = ["stacker"] }
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
image.workspace = true
iso_currency = "0.7"
isocountry = "0.3"
isolang = { version = "2.4", features = ["local_names", "list_languages"] }
jiff.workspace = true
log.workspace = true
entities = "1"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
qrcode.workspace = true
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
ratex-types = "0.1.14"
regex = "1"
rqrr = { version = "0.11", default-features = false }
rust-embed = "8.12"
serde.workspace = true
serde_json.workspace = true
similar = { version = "3.2", default-features = false, features = ["std", "text", "inline", "unicode"] }
smallvec = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
usvg = "0.46"
vte = { version = "0.15", default-features = false, features = ["std", "ansi"] }
web-time.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
notify = "8"

[target.'cfg(target_family = "wasm")'.dependencies]
jiff = { workspace = true, features = ["js"] }
rust-embed = { version = "8.12", features = ["debug-embed"] }
similar = { version = "3.2", default-features = false, features = ["wasm32_web_time"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSColorSampler",
    "NSColorSpace",
    "NSControl",
    "NSDockTile",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSSharingService",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSArray",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
] }
raw-window-handle.workspace = true
wry = { version = "0.57", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
image = { workspace = true, features = ["png"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[lints]
workspace = true

# The web gallery: small over fast, one unit so LTO sees everything.
[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
